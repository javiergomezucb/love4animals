services:
  db:
    image: postgres:18.3-alpine
    container_name: postgress-love4animals
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: javi123
      POSTGRES_DB: Love4AnimalsDb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    container_name: pgadmin-ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: test@test.com
      PGADMIN_DEFAULT_PASSWORD: test
    ports:
      - "5050:80"
    depends_on:
      - db
volumes:
  postgres-data: